[workspace]
resolver = "2"
members = [
  "crates/grm-core",
]

[package]
name = "greg-repo-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Profile-based fleet settings manager for GitHub/Forgejo/Gitea repos (Rust + Slint)"

[[bin]]
name = "greg-repo-manager"
path = "src/main.rs"

[build-dependencies]
slint-build.workspace = true
anyhow.workspace = true

[dependencies]
grm-core.workspace = true
slint.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
which.workspace = true

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
slint = "1"
slint-build = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
which = "6"
grm-core = { path = "crates/grm-core", version = "0.1.0" }
